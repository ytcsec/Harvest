[package]
name = "harvest_campaign"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Dev-only on purpose. Depending on these for the wasm build would compile
# their #[contractimpl] entry points into this contract's wasm as well.
harvest_verifier = { path = "../harvest-verifier" }
mock_defindex_vault = { path = "../mock-defindex-vault" }
ark-bn254 = "0.5"
ark-ff = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
